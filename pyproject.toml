[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gugakgen"
version = "0.1.0"
description = "Piece-specific symbolic generation for Korean traditional music"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary research code" }
authors = [
  { name = "Gugak Generation Research Team" },
]
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6.0,<7",
  "music21>=9.1,<11",
  "torch>=2.1",
]

[project.optional-dependencies]
evaluation = [
  "ripser>=0.6,<1",
  "scipy>=1.10,<2",
]
tutorial = [
  "ipywidgets>=8.1,<9",
  "matplotlib>=3.7,<4",
  "networkx>=3.2,<4",
  "pandas>=2.0,<4",
  "tqdm>=4.66,<5",
]
dev = [
  "mypy>=1.10,<2",
  "nbformat>=5.10,<6",
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<8",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
packages = ["gugakgen"]
