[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gugakgen"
version = "1.0.0rc1"
description = "Structure-preserving generation of Korean court music from a single piece: masked discrete diffusion on a phrase graph"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT (code only; see data/README.md for the score data)" }
authors = [
  { name = "Seong-Heon Lee" },
]
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6.0,<7",
  "torch>=2.1",
]

[project.optional-dependencies]
evaluation = [
  "ripser>=0.6,<1",
  "scipy>=1.10,<2",
]
tutorial = [
  "matplotlib>=3.7,<4",
  "pandas>=2.0,<4",
  "verovio>=4.3",
]
figures = [
  "matplotlib>=3.7,<4",
  "scipy>=1.10,<2",
  "ripser>=0.6,<1",
  "verovio>=4.3",
  "pymupdf>=1.24",
  "pillow>=10",
]
web = [
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "onnxscript>=0.1",
]
dev = [
  "mypy>=1.10,<2",
  "nbformat>=5.10,<6",
  "nbconvert>=7",
  "ipykernel>=6",
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<8",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
packages = ["gugakgen"]
