<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img">
<title>부분다양체들의 뭉치로 된 닫힌 연결 다양체 위의 흐름과 몫 그래프</title>
<desc>닫힌 곡면 M은 네 영역 M_A–M_D가 목으로 이어진 연결 곡면이다. 곡선 γ(t)는 M_A에서 출발해 M_B 뒤편을 돌아 M_C를 지나 M_A로 돌아와 같은 길을 다시 지난 뒤 M_D로 간다(환입). 점은 관측된 마디 x_k = γ(t_k). 오른쪽은 각 영역을 한 점으로 접는 사상 π로 얻은 phrase graph G. 개념도 초안(2026-11-10), 인쇄용은 TikZ로 다시 그릴 예정.</desc>
