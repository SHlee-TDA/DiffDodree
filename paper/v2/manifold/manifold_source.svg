.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500}.m{font-style:italic;font-family:"Times New Roman","STIX Two Text",serif;font-size:16px}
.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}
.curve{fill:none;stroke:#2C2C2A;stroke-width:1.3}.aux{fill:none;stroke:#888780;stroke-width:0.5}
.node{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.6}.nl{font-size:14px;font-weight:500;fill:#3C3489}
.g{fill:none;stroke:#5F5E5A;stroke-width:1}
</style>
